# Skylar One PowerPack MCP Server -- rate-limit zone declaration.
#
# This file is separate from powerpack-mcp.fragment because of where nginx allows each directive:
#
#   limit_req_zone  is valid only in the  http  context.
#   limit_req       is valid in           http, server, location.
#
# powerpack-mcp.fragment is included from inside the em7 server block, so the zone cannot be
# declared there.  It has to live in a file that nginx reads at http level.
#
# Installed to: /opt/em7/share/config/nginx.d/powerpack-mcp-zone.conf
#
# That directory is picked up by an existing wildcard in /etc/nginx/nginx.conf:
#
#     include /opt/em7/share/config/nginx.d/*.conf;
#
# Being wildcard-activated makes this file safe to add and to remove: nginx tolerates a wildcard
# matching zero files, so `rpm -e` removing it cannot break nginx.  The fragment does not have
# that property; it depends on an include line in a platform-owned file, which a platform upgrade
# can remove.
#
# The zone name is namespaced to this service so it cannot collide with a platform zone.

limit_req_zone $binary_remote_addr zone=powerpack_mcp:10m rate=30r/s;
